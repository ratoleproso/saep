<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoFix - Clientes</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topo">

    <div class="marca">
        🔧 AutoFix
    </div>

    <nav>
        <a href="../dashboard.html">Dashboard</a>
        <a href="../clientes/clientes.html">Clientes</a>
        <a href="../veiculos/veiculos.html">Veículos</a>
        <a href="../ordens/ordens.html">Ordens</a>
    </nav>

</header>

<main class="container">

    <div class="pagina-cabecalho">

        <div>
            <h1>Clientes</h1>
            <p>Gerenciamento de clientes</p>
        </div>

        <button
            class="btn btn-primary"
            onclick="abrirFormulario()">

            + Novo Cliente

        </button>

    </div>

    <div id="formularioCliente"
         class="form-box"
         style="display:none;">

        <h2>Cadastrar Cliente</h2>

        <form id="formCliente">

            <input type="hidden" id="clienteId">

            <div class="grid-form">

                <div class="campo">
                    <label>Nome</label>

                    <input
                        id="nome"
                        required>
                </div>

                <div class="campo">
                    <label>CPF</label>

                    <input
                        id="cpf"
                        placeholder="000.000.000-00"
                        required>
                </div>

                <div class="campo">
                    <label>Telefone</label>

                    <input id="telefone">
                </div>

                <div class="campo">
                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email">
                </div>

                <div class="campo campo-grande">
                    <label>Endereço</label>

                    <input id="endereco">
                </div>

            </div>

            <button class="btn btn-primary">
                Salvar
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="fecharFormulario()">

                Cancelar

            </button>

        </form>

    </div>

    <div class="tabela-box">

        <div class="busca">

            <input
                id="busca"
                placeholder="Buscar por nome ou CPF..."
                oninput="filtrarClientes()">

        </div>

        <table>

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaClientes"></tbody>

        </table>

    </div>

</main>

<script src="clientes.js"></script>

</body>

</html>
