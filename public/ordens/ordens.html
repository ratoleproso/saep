<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoFix - Ordens de Serviço</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topo">

    <div class="marca">
        🔧 AutoFix
    </div>

    <nav>
        <a href="../dashboard.html">Dashboard</a>
        <a href="../clientes/clientes.html">Clientes</a>
        <a href="../veiculos/veiculos.html">Veículos</a>
        <a href="../ordens/ordens.html">Ordens</a>
    </nav>

</header>

<main class="container">

    <div class="pagina-cabecalho">

        <div>
            <h1>Ordens de Serviço</h1>
            <p>Controle dos serviços da oficina</p>
        </div>

        <button
            class="btn btn-primary"
            onclick="abrirFormulario()">

            + Nova OS

        </button>

    </div>

    <div
        id="formularioOS"
        class="form-box"
        style="display:none;">

        <h2>Nova Ordem de Serviço</h2>

        <form id="formOS">

            <div class="grid-form">

                <div class="campo">

                    <label>Cliente</label>

                    <select
                        id="cliente"
                        required>

                        <option value="">
                            Selecione
                        </option>

                    </select>

                </div>

                <div class="campo">

                    <label>Veículo</label>

                    <select
                        id="veiculo"
                        required>

                        <option value="">
                            Selecione
                        </option>

                    </select>

                </div>

                <div class="campo campo-grande">

                    <label>Descrição do serviço</label>

                    <textarea
                        id="descricao"
                        required>
                    </textarea>

                </div>

                <div class="campo">

                    <label>Valor</label>

                    <input
                        type="number"
                        step="0.01"
                        id="valor">

                </div>

                <div class="campo">

                    <label>Status</label>

                    <select id="status">

                        <option value="Aberta">
                            Aberta
                        </option>

                        <option value="Em andamento">
                            Em andamento
                        </option>

                        <option value="Concluída">
                            Concluída
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn btn-primary">
                Salvar OS
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="fecharFormulario()">

                Cancelar

            </button>

        </form>

    </div>

    <div class="tabela-box">

        <table>

            <thead>

                <tr>
                    <th>Data</th>
                    <th>Cliente</th>
                    <th>Veículo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="listaOrdens"></tbody>

        </table>

    </div>

</main>

<script src="ordens.js"></script>

</body>

</html>
