<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoFix - Veículos</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topo">

    <div class="marca">
        🔧 AutoFix
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="veiculos.html">Veículos</a>
        <a href="ordens.html">Ordens</a>
    </nav>

</header>

<main class="container">

    <div class="pagina-cabecalho">

        <div>
            <h1>Veículos</h1>
            <p>Veículos cadastrados na oficina</p>
        </div>

        <button
            class="btn btn-primary"
            onclick="abrirFormulario()">

            + Novo Veículo

        </button>

    </div>

    <div
        id="formularioVeiculo"
        class="form-box"
        style="display:none;">

        <h2>Cadastrar Veículo</h2>

        <form id="formVeiculo">

            <div class="grid-form">

                <div class="campo">

                    <label>Cliente</label>

                    <select
                        id="cliente"
                        required>

                        <option value="">
                            Selecione um cliente
                        </option>

                    </select>

                </div>

                <div class="campo">

                    <label>Placa</label>

                    <input
                        id="placa"
                        required>

                </div>

                <div class="campo">

                    <label>Marca</label>

                    <input
                        id="marca"
                        required>

                </div>

                <div class="campo">

                    <label>Modelo</label>

                    <input
                        id="modelo"
                        required>

                </div>

                <div class="campo">

                    <label>Ano</label>

                    <input
                        type="number"
                        id="ano"
                        required>

                </div>

            </div>

            <button class="btn btn-primary">
                Salvar
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="fecharFormulario()">

                Cancelar

            </button>

        </form>

    </div>

    <div class="tabela-box">

        <table>

            <thead>

                <tr>
                    <th>Cliente</th>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                </tr>

            </thead>

            <tbody id="listaVeiculos"></tbody>

        </table>

    </div>

</main>

<script src="js/veiculos.js"></script>

</body>

</html>
